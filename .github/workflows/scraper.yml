name: Nightly Price Scraper

# 1. When should this run?
on:
  schedule:
    # "0 0 * * *" means "Run at exactly 12:00 AM UTC every single day"
    - cron: '0 0 * * *'
  # workflow_dispatch adds a "Run" button on GitHub so you can test it manually
  workflow_dispatch: 

jobs:
  scrape-prices:
    # GitHub provides a free Linux server to run this
    runs-on: ubuntu-latest 
    
    steps:
      # Step 1: Download your code onto the GitHub server
      - name: Checkout Repository
        uses: actions/checkout@v4
        
      # Step 2: Install Node.js
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20' 
          
      # Step 3: Install Puppeteer, Stealth, PG, etc.
      - name: Install Dependencies & Browsers
        working-directory: ./scraper
        # Force the Chrome download into a local folder to guarantee it is found
        env:
          PUPPETEER_CACHE_DIR: ${{ github.workspace }}/scraper/.cache/puppeteer
        run: |
          # Installing 'puppeteer' directly triggers the Chrome download automatically.
          # We removed the 'npx' command that was causing the Permission Denied error!
          npm install puppeteer puppeteer-extra puppeteer-extra-plugin-stealth pg dotenv
        
      # Step 4: Run your script! 
      - name: Run Scraper Script
        working-directory: ./scraper
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          # Read Chrome from the exact same local folder
          PUPPETEER_CACHE_DIR: ${{ github.workspace }}/scraper/.cache/puppeteer
        run: node index.js